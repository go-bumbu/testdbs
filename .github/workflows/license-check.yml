name: License check
on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  license-check:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v5

      # go-licence-detector v0.10.0 needs Go >= 1.24; this module targets
      # 1.23.4 (see go.mod), so pin a newer toolchain just for the tool.
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.4'

      # Install go-licence-detector
      - name: Install go-licence-detector
        run: |
          go install go.elastic.co/go-licence-detector@v0.10.0

      - name: License check
        run: make license-check
