name: golang
# Same triggers as the lint and license workflows: PRs, plus pushes to main.
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  test:
    # ubuntu-latest ships a working Docker daemon, which testcontainers-go
    # uses to spin up the MariaDB / MySQL / PostgreSQL / CGo-SQLite backends
    # (MySQL is opt-in for users; the package's own TestMain adds it). Unlike
    # consumers of this library, testdbs runs the full -alldbs matrix in CI:
    # launching those containers is the core behaviour under test.
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: run tests
        run: make test

      # reads the cover profile `make test` wrote; runs no tests of its own
      - name: ensure test coverage
        run: make coverage

      # a separate module using testdbs as a user would: plain and TESTDBS_ALL
      - name: run consumer tests
        run: make test-consumer
